<div class="dp-page">

  <!-- Left: Code Panel -->
  <div class="code-panel">
    <div class="ide-container">
      <div class="ide-tabs">
        <button *ngFor="let lang of languages"
                class="ide-tab"
                [class.active]="activeLang === lang"
                (click)="activeLang = lang">
          {{ lang }}
        </button>
        <button class="copy-btn" (click)="copyCode()" [title]="copied ? 'Copied!' : 'Copy'">
          {{ copied ? '✓ Copied' : '📋 Copy' }}
        </button>
      </div>
      <div class="ide-content">
        <pre><code [innerHTML]="highlightedCode"></code></pre>
      </div>
    </div>
  </div>

  <!-- Right: Info Panel -->
  <div class="info-panel">
    <a routerLink="/design-patterns" class="back-link">
      <span class="back-arrow">←</span>
      <span>{{ 'observer.back' | translate }}</span>
    </a>

    <div class="info-header">
      <span class="pattern-badge">{{ 'observer.subtitle' | translate }}</span>
      <h1 class="pattern-title">{{ 'observer.title' | translate }}</h1>
    </div>

    <div class="pattern-desc">
      <p>{{ 'observer.description' | translate }}</p>
    </div>

    <div class="info-footer">
      <div class="footer-left">
        <button class="lang-btn" (click)="toggleLanguage()">
          {{ currentLang === 'en' ? 'IT' : 'EN' }}
        </button>
      </div>
      <span class="version">{{ 'footer.copyright' | translate }}{{ version }}</span>
    </div>
  </div>

</div>
