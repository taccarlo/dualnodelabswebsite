<div class="exercise-page">
  <div class="exercise-header">
    <a routerLink="/exercises/patterns" class="back-link">
      <span class="back-arrow">←</span>
      <span>{{ 'exercises.patterns.builder.back' | translate }}</span>
    </a>
    <h1 class="exercise-title">{{ currentExercise.title }}</h1>
    <p class="exercise-desc">{{ currentExercise.description }}</p>
  </div>

  <div class="open-action">
    <p class="open-text">Open the {{ currentExercise.label }} pattern exercise in StackBlitz:</p>
    @if (currentExercise.url) {
      <a
        [href]="currentExercise.url"
        target="_blank"
        rel="noopener noreferrer"
        class="mat-btn mat-btn-filled mat-btn-lg">
        Open in StackBlitz
      </a>
    } @else {
      <span class="mat-btn mat-btn-filled mat-btn-lg">Coming soon</span>
    }
  </div>
</div>
