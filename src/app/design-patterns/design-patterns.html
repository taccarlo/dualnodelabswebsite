<div class="page-content">

  <section class="subpage-hero">
    <div class="content-container section-padding" style="text-align: center;">
      <img src="assets/DualNode512x512NoBackground.png" alt="Dual Node Logo" class="subpage-logo" />
      <h1 class="heading-lg" style="color: white;">{{ 'designpatterns.header.title' | translate }}</h1>
      <p class="body-lg" style="color: rgba(255,255,255,0.8); max-width: 600px; margin: var(--space-md) auto 0;">{{ 'designpatterns.description' | translate }}</p>
    </div>
  </section>

  <section class="content-section">
    <div class="content-container section-padding">

      <input type="search"
             class="pattern-search"
             [placeholder]="'designpatterns.search.placeholder' | translate"
             [attr.aria-label]="'designpatterns.search.placeholder' | translate"
             [value]="searchTerm"
             (input)="searchTerm = $any($event.target).value" />

      <div class="pattern-category" *ngFor="let category of categories">
        <h3 class="category-title">{{ category.titleKey | translate }}</h3>
        <ul class="pattern-list">
          <li *ngFor="let p of category.patterns"
              [routerLink]="p.route"
              [class.clickable]="!!p.route">{{ p.name }}</li>
        </ul>
      </div>

      <p class="search-empty" *ngIf="categories.length === 0">{{ 'designpatterns.search.noResults' | translate }}</p>
    </div>
  </section>

  <footer class="site-footer" style="margin-top: auto;">
    <div class="content-container">
      <div class="footer-inner">
        <div class="footer-brand">
          <img src="assets/dualnode.png" alt="Dual Node" class="footer-logo" />
          <span class="footer-name">Dual Node</span>
        </div>
        <button class="mat-btn mat-btn-text lang-btn" (click)="toggleLanguage()">
          {{ currentLang === 'en' ? 'IT' : 'EN' }}
        </button>
        <p class="footer-copy">{{ 'footer.copyright' | translate }}{{ version }}</p>
      </div>
    </div>
  </footer>

</div>
