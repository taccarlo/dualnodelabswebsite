<div class="cookie-banner" *ngIf="visible">
  <div class="cookie-banner-content">
    <p class="cookie-banner-text">{{ 'cookiebanner.text' | translate }}</p>
    <div class="cookie-banner-actions">
      <button class="mat-btn mat-btn-filled" (click)="accept()">{{ 'cookiebanner.accept' | translate }}</button>
      <button class="mat-btn mat-btn-outlined" (click)="decline()">{{ 'cookiebanner.decline' | translate }}</button>
    </div>
  </div>
</div>
