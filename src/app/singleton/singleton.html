<div class="singleton-page">

  <!-- Left: Code -->
  <div class="code-panel">
    <div class="ide-container">
      <div class="ide-tabs">
        <button *ngFor="let lang of languages"
                class="ide-tab"
                [class.active]="activeLang === lang"
                (click)="activeLang = lang">
          {{ lang }}
        </button>
        <button class="copy-btn" (click)="copyCode()" [title]="copied ? 'Copied!' : 'Copy'">
          {{ copied ? '✓ Copied' : '📋 Copy' }}
        </button>
      </div>
      <div class="ide-content">
        <pre><code [innerHTML]="highlightedCode"></code></pre>
      </div>
    </div>
  </div>

  <!-- Right: Info -->
  <div class="info-panel">
    <a routerLink="/design-patterns" class="back-link">← {{ 'singleton.back' | translate }}</a>
    <h1 class="pattern-title">{{ 'singleton.title' | translate }}</h1>
    <p class="pattern-subtitle">{{ 'singleton.subtitle' | translate }}</p>
    <p class="pattern-desc">{{ 'singleton.description' | translate }}</p>
    <div class="spacer"></div>
    <div class="info-footer">
      <button class="mat-btn mat-btn-text lang-btn" (click)="toggleLanguage()">
        {{ currentLang === 'en' ? 'IT' : 'EN' }}
      </button>
      <span class="version">{{ 'footer.copyright' | translate }}{{ version }}</span>
    </div>
  </div>

</div>
